name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Service containers to run with the job
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r messaging_app/requirements.txt
        pip install flake8 coverage mysqlclient # Ensure these are also in requirements.txt

    - name: Run Linting with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 messaging_app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 messaging_app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Tests with Coverage
      env:
        # Pass database credentials to the Django app
        DB_NAME: test_db
        DB_USER: root
        DB_PASSWORD: rootpassword
        DB_HOST: 127.0.0.1 # Connect to the service container
        DB_PORT: 3306
      run: |
        cd messaging_app
        coverage run -m pytest

    - name: Generate Coverage Report
      run: |
        cd messaging_app
        coverage report # Print report to logs
        coverage xml    # Generate XML report for artifact upload

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: messaging_app/coverage.xml